<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Wicky Eats — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#26221A; --ink-soft:#5c5748; --cream:#FFFDF7; --lime:#DCEA7B; --line:rgba(38,34,26,0.15); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    background:#EDE6D6;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    width:100%;
    max-width:360px;
    background:var(--cream);
    border-radius:24px;
    padding:32px 28px;
    box-shadow:0 20px 50px rgba(38,34,26,0.15);
  }
  h1{ font-family:'Fredoka', sans-serif; font-size:22px; margin-bottom:6px; }
  p.sub{ font-size:13px; color:var(--ink-soft); margin-bottom:24px; }
  label{ font-size:12.5px; font-weight:700; display:block; margin-bottom:6px; }
  input[type="password"]{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    font-size:14px;
    font-family:inherit;
    margin-bottom:16px;
  }
  button{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    background:var(--ink);
    color:#fff;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  button:disabled{ opacity:0.6; cursor:default; }
  .error{ color:#b23b4e; font-size:12.5px; margin-bottom:14px; min-height:1em; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Wicky <em style="color:var(--ink); font-style:normal;">Eats</em> Admin</h1>
    <p class="sub">Log in to add a new recipe.</p>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <div class="error" id="error"></div>
    <button type="submit" id="submitBtn">Log in</button>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value })
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || 'Login failed.';
          return;
        }
        window.location.href = '/admin/';
      } catch {
        errorEl.textContent = 'Network error — please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
