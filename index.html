<style>
  :root{
    --ink:#26221A;
    --ink-soft:#5c5748;
    --cream:#FFFDF7;
    --nav-dark:#221F19;
    --lime:#DCEA7B;
    --lavender:#D6C3EC;
    --peach:#F5C99A;
    --berry:#E8778F;
    --sage:#A6C98F;
    --line:rgba(38,34,26,0.12);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 10%, #f3e9d8 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #f0e2ef 0%, transparent 45%),
      #EDE6D6;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:40px 16px 60px;
  }
  h1,h2,h3,.display{ font-family:'Fredoka', sans-serif; }

  /* ---------------- APP FRAME ---------------- */
  .app{
    width:100%;
    max-width:430px;
    background:linear-gradient(165deg, #EAF3A6 0%, #F0E8B0 32%, #F1E3D4 62%, #ECE1EE 100%);
    border-radius:36px;
    box-shadow:0 30px 70px rgba(38,34,26,0.28), 0 0 0 10px #fff, 0 0 0 11px rgba(38,34,26,0.08);
    overflow:hidden;
    position:relative;
    min-height:850px;
    display:flex;
    flex-direction:column;
  }

  .app-scroll{
    flex:1;
    overflow-y:auto;
    padding:26px 22px 110px;
  }
  .app-scroll::-webkit-scrollbar{ display:none; }

  /* ---------------- TOP BAR ---------------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .brand{ font-size:22px; font-weight:600; letter-spacing:-0.01em; }
  .brand em{ font-style:normal; color:var(--berry); }
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,0.6);
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    border:none; cursor:pointer;
  }

  .tagline{ font-size:13.5px; color:var(--ink-soft); margin-bottom:24px; max-width:26ch; line-height:1.5; }

  /* ---------------- CATEGORY ROW ---------------- */
  .cat-row{ display:flex; gap:10px; margin-bottom:26px; }
  .cat{
    padding:10px 24px;
    border-radius:22px;
    background:rgba(255,255,255,0.45);
    border:2px solid transparent;
    cursor:pointer;
    font-family:'Nunito', sans-serif;
    font-size:13px; font-weight:700;
    opacity:0.6;
    transition:opacity .2s, transform .2s;
  }
  .cat.active{ opacity:1; background:#fff; border-color:var(--ink); }
  .cat:hover{ transform:translateY(-2px); opacity:1; }

  /* ---------------- COUNT ROW ---------------- */
  .count-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .count-row h2{ font-size:24px; font-weight:600; }
  .count-actions{ display:flex; gap:8px; }
  .chip-btn{
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,0.7);
    border:none; cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .chip-btn.active-toggle{ background:var(--ink); color:#fff; }

  /* ---------------- RECIPE CARD ---------------- */
  .recipe-list{ display:flex; flex-direction:column; gap:20px; }
  .rcard{
    background:var(--cream);
    border-radius:24px;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(38,34,26,0.08);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .rcard:hover{ transform:translateY(-3px); box-shadow:0 16px 32px rgba(38,34,26,0.14); }
  .rcard-photo{
    position:relative;
    height:180px;
    display:flex; align-items:center; justify-content:center;
    font-size:76px;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.55), transparent 50%),
      linear-gradient(135deg, var(--swatch-a,#DCEA7B), var(--swatch-b,#F5C99A));
  }
  .rcard-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
  }
  .detail-img{
    width:100%; height:100%;
    object-fit:cover;
    border-radius:26px;
  }
  .rcard-badge{
    position:absolute; top:14px; right:14px;
    background:rgba(255,255,255,0.92);
    padding:6px 12px;
    border-radius:20px;
    font-size:11.5px;
    font-weight:700;
    display:flex; align-items:center; gap:5px;
  }
  .rcard-body{ padding:16px 18px 20px; }
  .rcard-title{ font-size:18px; font-weight:600; margin-bottom:4px; }
  .rcard-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; }
  .attr-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .attr-pill{
    font-size:11px; font-weight:800;
    padding:5px 10px;
    border-radius:20px;
    background:rgba(207,234,81,1);
    color:var(--ink);
  }
  .attr-pill:nth-child(2n){ background:rgba(236,200,231,1); color:var(--ink); }
  .stat-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .stat-pill{
    font-size:11.5px; font-weight:700;
    padding:6px 11px;
    border-radius:20px;
    display:flex; align-items:center; gap:5px;
  }
  .stat-pill.lime{ background:var(--lime); }
  .stat-pill.lav{ background:rgba(179, 218, 254, 1); }
  .stat-pill.peach{ background:var(--peach); }

  .card-macro-row{
    display:flex; justify-content:space-between;
    margin-top:14px;
    padding-top:12px;
    border-top:1px dashed rgba(38,34,26,0.2);
  }
  .card-macro-row div{ text-align:left; }
  .card-macro-row b{ display:block; font-size:14px; font-weight:800; color:var(--ink); }
  .card-macro-row span{ font-size:10.5px; color:var(--ink-soft); font-weight:700; }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty-state .em{ font-size:38px; display:block; margin-bottom:10px; }

  /* ---------------- BOTTOM NAV ---------------- */
  .bottomnav{
    position:absolute; left:16px; right:16px; bottom:16px;
    background:var(--nav-dark);
    border-radius:26px;
    display:flex;
    justify-content:space-around;
    padding:12px 8px;
    box-shadow:0 12px 28px rgba(0,0,0,0.3);
  }
  .nav-item{
    background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:rgba(255,255,255,0.5);
    font-family:'Nunito', sans-serif;
    font-size:10px; font-weight:700;
    transition:color .2s;
  }
  .nav-item .ic{
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
  }
  .nav-item.active{ color:#fff; }
  .nav-item.active .ic{ background:var(--lime); color:var(--ink); }

  .toast{
    position:absolute; left:50%; bottom:92px;
    transform:translate(-50%, 10px);
    background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:20px;
    font-size:12.5px; font-weight:700;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap;
    z-index:40;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ---------------- DETAIL SCREEN ---------------- */
  .detail-screen{
    position:absolute; inset:0;
    background:linear-gradient(165deg, #F3DCEF 0%, #E9D0EE 45%, #DCC7EC 100%);
    border-radius:36px;
    display:none;
    flex-direction:column;
    overflow-y:auto;
    z-index:30;
  }
  .detail-screen.active{ display:flex; }
  .detail-top{
    padding:22px 22px 0;
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .round-btn{
    width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,0.75);
    border:none; cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }
  .round-btn.liked{ background:var(--berry); color:#fff; }

  .detail-photo{
    margin:10px 22px 0;
    height:230px;
    border-radius:26px;

const categories = [
  { id: "cold", label: "Cold" },
  { id: "pastry", label: "Pastry" }
];

let activeCategory = "all";
let currentServings = {};
let likedRecipes = {};

function escapeHtml(value){
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

const catRow = document.getElementById('catRow');
function renderCategories(){
  catRow.innerHTML = categories.map(c => `
    <button class="cat ${c.id === activeCategory ? 'active' : ''}" data-cat="${c.id}">
      ${c.label}
    </button>
  `).join('');
  catRow.querySelectorAll('.cat').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = activeCategory === btn.dataset.cat ? 'all' : btn.dataset.cat;
      renderCategories();
      renderList();
    });
  });
}

const recipeList = document.getElementById('recipeList');

function filteredRecipes(){
  const desserts = recipes.filter(r => r.type !== 'savoury');
  return activeCategory === 'all' ? desserts : desserts.filter(r => r.category === activeCategory);
}

function renderList(){
  const list = filteredRecipes();

  if(list.length === 0){
    recipeList.innerHTML = `
      <div class="empty-state">
        <span class="em">🍽️</span>
        Nothing filed under this category yet — more recipes coming soon.
      </div>`;
    return;
  }

  recipeList.innerHTML = list.map(r => `
    <div class="rcard" data-id="${escapeHtml(r.id)}" style="--swatch-a:${escapeHtml(r.swatchA)}; --swatch-b:${escapeHtml(r.swatchB)};">
      <div class="rcard-photo" style="--swatch-a:${escapeHtml(r.swatchA)}; --swatch-b:${escapeHtml(r.swatchB)};">
        <span class="rcard-badge">${escapeHtml(r.badge.icon)} ${escapeHtml(r.badge.label)}</span>
        ${r.image ? `<img class="rcard-img" src="${escapeHtml(r.image)}" alt="${escapeHtml(r.title)}" style="object-position:${escapeHtml(r.imagePosition || 'center')}">` : escapeHtml(r.emoji)}
      </div>
      <div class="rcard-body">
        <div class="rcard-title">${escapeHtml(r.title)}</div>
        <div class="rcard-sub">${escapeHtml(r.subtitle)}</div>
        <div class="stat-row">
          <span class="stat-pill lav">🕐 ${escapeHtml(r.time)}</span>
        </div>
        <div class="card-macro-row">
          <div><b>${escapeHtml(r.macros.kcal)}</b><span>kcal</span></div>
          <div><b>${escapeHtml(r.macros.protein)}g</b><span>protein</span></div>
        </div>
      </div>
    </div>
  `).join('');

  recipeList.querySelectorAll('.rcard').forEach(card => {
    card.addEventListener('click', () => openDetail(card.dataset.id));
  });

  renderSavoury();
}

const savourySection = document.getElementById('savourySection');
function renderSavoury(){
  const savoury = recipes.filter(r => r.type === 'savoury');
  if(savoury.length === 0){ savourySection.innerHTML = ''; return; }
  savourySection.innerHTML = `
    <div class="savoury-heading">Savoury Recipes</div>
    ${savoury.map(r => `
      <div class="scard" data-id="${escapeHtml(r.id)}">
        <span class="scard-emoji">${escapeHtml(r.emoji)}</span>
        <div class="scard-info">
          <div class="scard-title">${escapeHtml(r.title)}</div>
          <div class="scard-sub">${escapeHtml(r.subtitle)}</div>
        </div>
        <span class="scard-kcal">${escapeHtml(r.macros.kcal)} kcal</span>
      </div>
    `).join('')}
  `;
  savourySection.querySelectorAll('.scard').forEach(card => {
    card.addEventListener('click', () => openDetail(card.dataset.id));
  });
}

const detailScreen = document.getElementById('detailScreen');

function scaleAmount(amount, base, servings){
  const val = (amount / base) * servings;
  return Math.round(val * 10) / 10;
}

function openDetail(id){
  const r = recipes.find(x => x.id === id);
  if(!r) return;
  if(!currentServings[id]) currentServings[id] = r.baseServings;
  renderDetail(r);
  detailScreen.classList.add('active');
}

function closeDetail(){
  detailScreen.classList.remove('active');
}

function toggleLike(id){
  likedRecipes[id] = !likedRecipes[id];
  const r = recipes.find(x => x.id === id);
  renderDetail(r);
}

function adjustServings(id, delta){
  currentServings[id] = Math.max(1, (currentServings[id] || 1) + delta);
  const r = recipes.find(x => x.id === id);
  renderDetail(r);
}

function renderDetail(r){
  const servings = currentServings[r.id];
  const liked = !!likedRecipes[r.id];

  detailScreen.innerHTML = `
    <div class="detail-top">
      <button class="round-btn detail-close">←</button>
      <button class="round-btn detail-like ${liked ? 'liked' : ''}">${liked ? '♥' : '♡'}</button>
    </div>
    <div class="detail-photo" style="--swatch-a:${escapeHtml(r.swatchA)}; --swatch-b:${escapeHtml(r.swatchB)};">
      ${r.image ? `<img class="detail-img" src="${escapeHtml(r.image)}" alt="${escapeHtml(r.title)}" style="object-position:${escapeHtml(r.imagePosition || 'center')}">` : escapeHtml(r.emoji)}
    </div>
    <div class="detail-body">
      <div class="detail-title">${escapeHtml(r.title)}, <span class="kcal">${escapeHtml(r.macros.kcal)} Kcal</span></div>
      <div class="detail-sub">${escapeHtml(r.subtitle)}</div>
      <div class="macro-table">
        <div class="macro-cell"><div class="label">protein</div><div class="val">${escapeHtml(r.macros.protein)}g</div></div>
        <div class="macro-cell"><div class="label">fat</div><div class="val">${escapeHtml(r.macros.fat)}g</div></div>
        <div class="macro-cell"><div class="label">carbs</div><div class="val">${escapeHtml(r.macros.carbs)}g</div></div>
      </div>

      <div class="section-label">Ingredients</div>
      <div class="servings-row">
        <button class="stepper-btn servings-dec">–</button>
        <span>${servings} serving${servings === 1 ? '' : 's'}</span>
        <button class="stepper-btn servings-inc">+</button>
      </div>
      <ul class="ingredients">
        ${r.ingredientSections
          ? r.ingredientSections.map(sec => `
              <li class="ing-section-header">${escapeHtml(sec.label)}</li>
              ${sec.items.map(ing => {
                const scaled = scaleAmount(ing.amount, r.baseServings, servings);
                const amtStr = ing.unit ? `${scaled} ${escapeHtml(ing.unit)}` : `${scaled}`;
                return `<li><span>${escapeHtml(ing.name)}</span><span class="amt">${amtStr}</span></li>`;
              }).join('')}
            `).join('')
          : r.ingredients.map(ing => {
              const scaled = scaleAmount(ing.amount, r.baseServings, servings);
              const amtStr = ing.unit ? `${scaled} ${escapeHtml(ing.unit)}` : `${scaled}`;
              return `<li><span>${escapeHtml(ing.name)}</span><span class="amt">${amtStr}</span></li>`;
            }).join('')
        }
      </ul>

      <div class="section-label">Instructions</div>
      <ol class="steps">
        ${r.steps.map((s,i) => `<li><span class="step-num">${i+1}</span><span>${escapeHtml(s)}</span></li>`).join('')}
      </ol>
    </div>
  `;

  detailScreen.querySelector('.detail-close').addEventListener('click', closeDetail);
  detailScreen.querySelector('.detail-like').addEventListener('click', () => toggleLike(r.id));
  detailScreen.querySelector('.servings-dec').addEventListener('click', () => adjustServings(r.id, -1));
  detailScreen.querySelector('.servings-inc').addEventListener('click', () => adjustServings(r.id, 1));
}

const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    if(tab === 'home' || tab === 'recipes'){
      closeDetail();
      document.getElementById('mainScreen').scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      showToast(tab === 'favorites' ? 'Favorites — coming soon' : 'Profile — coming soon');
    }
  });
});

renderCategories();
renderList();
</script>
